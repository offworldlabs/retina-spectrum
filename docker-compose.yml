services:
  retina-spectrum:
    build: .
    restart: unless-stopped
    network_mode: host        # SDRplay API uses host shared memory — matches blah2. Port 3020 on host directly.
    pid: "host"               # required for SDRplay service access — matches blah2
    privileged: true          # required for USB SDR access
    volumes:
      - /dev/shm:/dev/shm:rw
      - /dev/bus/usb:/dev/bus/usb:rw
      # .so and sdrplay_apiService are baked into the image (from blah2-arm/lib/sdrplay-3.15.2/arm64/)
      # No host bind-mounts needed — version is pinned at build time, matches blah2-arm exactly.
    # No SDRplay service kill before launch. The one that was here never ran: the
    # image has no pkill. A working `pkill -f` on that name would also have
    # killed this shell, whose command line contains it. On a node, the host
    # side (retina-gui, the watchdog) resets the service; see the README's
    # troubleshooting section to do it by hand.
    command: bash -c "sleep 2 && retina-spectrum --web-dir /web"
